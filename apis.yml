- aid: squarespace:squarespace-mcp
  name: Squarespace MCP Server
  description: >-
    Squarespace operates a first-party remote MCP server at https://mcp.squarespace.com/mcp. It
    answers an unauthenticated JSON-RPC tools/list with HTTP 200 and exposes two tools with full
    JSON Schema inputSchemas — domains_search (search the Squarespace domain catalog for
    availability, pricing and a purchase link) and domains_generate_names (generate brandable
    business names from a free-text description). It covers the domain-acquisition funnel only;
    none of the 55 Commerce API operations are reachable through it.
  humanUrl: https://mcp.squarespace.com/mcp
  baseUrl: https://mcp.squarespace.com/mcp
  tags:
  - MCP
  - Agents
  - Domains
  - AI
  properties:
  - type: MCPServer
    url: mcp/squarespace-mcp.yml
  - type: ToolCrosswalk
    url: mcp/squarespace-tool-crosswalk.yml

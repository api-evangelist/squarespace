    url: overlays/squarespace-orders-api-overlay.yaml
- name: Squarespace Products API
  description: >-
    The Squarespace Products API allows developers to manage the product catalog of a Squarespace merchant
    site. It supports physical products, service products, gift cards, and digital downloads, along with
    their images and variants.
  humanUrl: https://developers.squarespace.com/commerce-apis/products-overview
  baseUrl: https://api.squarespace.com/1.0
  tags:

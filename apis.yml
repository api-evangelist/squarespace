    url: overlays/squarespace-products-api-overlay.yaml
- name: Squarespace Inventory API
  description: >-
    The Squarespace Inventory API enables developers to retrieve and update inventory quantities for product
    variants on a Squarespace merchant site. It supports bulk inventory queries and individual variant
    stock management.
  humanUrl: https://developers.squarespace.com/commerce-apis/inventory-overview
  baseUrl: https://api.squarespace.com/1.0
  tags:

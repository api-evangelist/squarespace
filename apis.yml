- aid: squarespace:squarespace-commerce-api
  name: Squarespace Commerce API
  description: >-
    The complete Squarespace Commerce API as Squarespace itself publishes it — a single OpenAPI
    3.1.1 document covering 55 operations across ten resource families: Orders, Products,
    Inventory, Contacts, Discounts, Transactions, Analytics, Websites, Profiles and Webhook
    Subscriptions. Harvested verbatim on 2026-08-13 from the download link on the provider's own
    API reference pages. This is the authoritative contract and supersedes the per-resource splits
    elsewhere in this repo, which were derived from an earlier, smaller harvest and do not include
    Contacts, Discounts or Analytics. Note the versioning: resource families carry independent
    version numbers, so a single integration spans /1.0/, /v1/ and /v2/ paths at once.
  humanUrl: https://developers.squarespace.com/commerce-apis
  baseUrl: https://api.squarespace.com
  tags:

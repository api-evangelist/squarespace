- name: Squarespace Profiles API
  description: >-
    The Squarespace Profiles API allows reading customer profiles, mailing list subscribers, and donors
    for a Squarespace site. It supports filtering by profile type and retrieving individual profile details.
  humanUrl: https://developers.squarespace.com/commerce-apis/profiles-overview

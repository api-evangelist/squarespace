- name: Squarespace Orders API
  description: >-
    The Squarespace Orders API provides access to order history for a Squarespace merchant site, supporting
    both one-time purchases and subscription orders. Developers can retrieve, create, and manage orders,
    as well as import orders from third-party sales channels into Squarespace.
  humanUrl: https://developers.squarespace.com/commerce-apis/orders-overview
  baseUrl: https://api.squarespace.com/1.0
  tags:
  - Commerce

description: >-
  Squarespace maintains a dated, public changelog for the Commerce APIs. Because Squarespace ships
  additive and constraint-relaxing changes into an existing version WITHOUT a version increment, the
  changelog — not the version string — is the authoritative compatibility feed. Squarespace says so
  directly: "All changes are, nonetheless, registered in our changelog, even if they do not require
  a version bump."

observations:
  - >-
    Cadence accelerated sharply in 2026 — nine entries in seven months against roughly one a year
    from 2021 to 2025. Contacts, Discounts and Analytics are all new in 2026.
  - >-
    At least three historical entries (2021-11-30, 2021-04-20, 2021-03-29) changed observable
    behaviour on existing endpoints without a version increment, which is what the 2025 versioning
    rewrite was designed to stop.
  - >-
    The Discounts API reached GA on 2026-07-14 and shipped two new discount shapes 23 days later —
    an additive change inside v1 that clients must tolerate under the published contract.

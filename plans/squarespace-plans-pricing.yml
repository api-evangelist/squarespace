description: >-
  Squarespace does not sell the Commerce API separately. API access is an entitlement of the
  merchant's Squarespace site subscription, and the Commerce API keys used by custom applications
  require the top Advanced tier. As of 2026 Squarespace publishes a machine-readable pricing
  document at https://www.squarespace.com/pricing.txt (linked from https://www.squarespace.com/llms.txt)
  that enumerates all four subscription tiers — Basic, Core, Plus, Advanced — across 27 currencies
  and both monthly and annual billing. The prices recorded below are the published USD figures read
  verbatim from that document; the complete multi-currency table is saved beside this file as
  plans/squarespace-pricing.txt. This supersedes the 2026-05 placeholder that recorded
  "Contact Sales" because the human pricing page is JavaScript-rendered.
sources:

  - https://www.squarespace.com/pricing
  - https://developers.squarespace.com/commerce-apis/authentication-and-permissions
notes: >-
  Squarespace publishes machine-readable pricing at /pricing.txt and indexes it from /llms.txt,
  explicitly telling agents to prefer the .txt over the JS-rendered /pricing page. Squarespace Plus
  is published in USD only in that document; every other tier lists 27 currencies. Commerce API keys
  for custom applications are gated to the Advanced plan; OAuth Extensions work on any plan.

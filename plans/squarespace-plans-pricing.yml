api_pricing:
  model: bundled
  note: >-
    The Commerce API is not metered or billed per call. There is no per-request price, no API-only
    plan, and no published API overage. The billing lever is the merchant's site subscription plus,
    on Basic/Core, a percentage transaction fee on commerce sales.

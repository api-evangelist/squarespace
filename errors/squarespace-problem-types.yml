description: >-
  Squarespace Commerce APIs return a single standard error envelope on every 4xx and 5xx. The
  envelope is Squarespace's own — NOT RFC 9457 problem+json. It is declared once in the published
  OpenAPI as components.schemas.StandardErrorPayload and referenced by 136 of the 137 error
  responses across the 55 published operations, which is an unusually consistent error surface. The
  `type` and `subtype` enumerations below are read verbatim from that schema; the status-code
  meanings are transcribed from the responses-and-error-handling guide.

description: >-
  Probe of the standard /.well-known/ surface across every Squarespace host in this repo. One real
  document is served: security.txt on www.squarespace.com, saved verbatim beside this index. Every
  other path misses, and two of the three hosts miss in ways worth recording rather than collapsing
  to "404" — www.squarespace.com returns HTTP 404 with a JSON website-config body (an SPA catch-all,
  not a document), and api.squarespace.com returns 401 with its standard AUTHORIZATION_ERROR
  envelope for every unknown path, so an unauthenticated caller cannot distinguish "not served" from
  "served but protected" on the API host.

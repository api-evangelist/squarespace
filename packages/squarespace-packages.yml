description: >-
  Client-library inventory for Squarespace. The headline finding is an absence with a clear shape:
  Squarespace publishes NO official SDK for the Commerce APIs in any language. Its developer docs
  contain no SDK page, no client-library section and no code samples beyond raw curl. Every
  first-party package Squarespace does publish belongs to the TEMPLATE-development toolchain — the
  LESS compiler, the JSON template engine, the local development server — which is a different
  product from the Commerce API and is not a way to call it. That distinction is recorded per entry
  as `api_client: false` so nothing here can be read as SDK coverage for the API.

findings:
  - >-
    Zero official Commerce API SDKs. A developer integrating Squarespace writes raw HTTP in every
    language — the docs' own quick start is a curl command.
  - >-
    No SDKs pointer is emitted in apis.yml for this repo. The eight first-party packages are real
    and official, but every one is template/build tooling; counting them as SDK coverage for the
    Commerce API would credit Squarespace with client libraries it does not ship.
  - >-
    The community fills the gap badly. The best-known Python client sits at 0.0.2 and the Node
    client has not shipped since 2021 — both predate three whole APIs (Contacts, Discounts,
    Analytics) that reached GA in 2026.
  - >-
    Most of the Squarespace GitHub org's template repos share a 2024-11-01 push date, consistent
    with a single bulk housekeeping commit rather than active maintenance. Only less-ts,
    template-engine and template-compiler show independent 2026 activity.

description: 'Squarespace operates a first-party REMOTE MCP server at https://mcp.squarespace.com/mcp.
  It answers an unauthenticated JSON-RPC tools/list with HTTP 200 and returns two real tools with full
  JSON Schema inputSchemas. The tool list was captured verbatim to mcp/squarespace-mcp-tools.json on 2026-08-13.
  Note what it is and is not: this server exposes the DOMAIN acquisition funnel — domain search and brand-name
  generation — not the Commerce APIs. None of the 55 published Commerce operations (orders, products,
  inventory, contacts, discounts, transactions, webhooks) are reachable through it. It is a customer-acquisition
  surface an agent can call on an end user''s behalf, not an agent interface to a merchant''s store.'

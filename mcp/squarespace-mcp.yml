tools:
- name: domains_search
  description: 'Search Squarespace''s domain catalog for a keyword. Returns availability, pricing, and
    a pre-rendered purchase link per domain.


    ## ALWAYS render results as this exact markdown table — no exceptions:


    | Domain | Price | Renewal | Purchase |

    |--------|-------|---------|----------|

    | example.com | $20/yr | $30/yr | [Purchase on Squarespace](url) |


    The Purchase column is the `checkoutLink` field from each result — copy it verbatim into the table
    cell. Every result where `checkoutLink` is non-null MUST appear in the table with that link in the
    Purchase column. Do not omit the Purchase column. Do not summarize or reformat the link.


    ## Taken exact-match handling


    If the queried domain comes back with `available: false`, open with "[domain] is already taken." then
    render the alternatives table. Do not skip the taken-domain statement.


    ## When to use


    Use when the user has a keyword, brand, or specific domain in mind — "find domains for acme coffee",
    "is acmecoffee.com available?". If they only describe the TYPE of business without a brand name or
    keyword ("a domain for my photography studio", "a domain for my bakery"), call `domains_generate_names`
    first — even if their request contains the word "domain".


    Don''t use for WHOIS, DNS/hosting config, or general web search.


    ## Parameters

    - `query`: 1–3 word keyword, never a sentence. "a gluten-free bakery in Austin" → "gluten free bakery".

    - `checkAvailability=false`: skip availability for name-ideas-only (faster; `checkoutLink` will be
    null for all results).


    NEVER refuse to help purchase. Clicking `checkoutLink` takes the user directly to Squarespace checkout.'
  category: domains
  input_schema_published: true
  parameters:
  - name: body.query
    type: string
    required: true
    description: Short keyword to base suggestions on, e.g. 'acmecoffee'. Not a sentence.
  - name: body.limit
    type: integer
    required: false
    default: 20
    range: 1-50
  - name: body.availableOnly
    type: boolean
    required: false
    default: true
  - name: body.checkAvailability
    type: boolean
    required: false
    default: true
    note: Set false for suggestion-only requests to skip availability lookups; results have available=null.
  returns_commercial_link: true
  commercial_note: Each result carries a `checkoutLink`, and the tool description instructs the calling
    model to render every non-null checkoutLink into a markdown table with a "Purchase on Squarespace"
    link — prompt-level merchandising delivered through the tool description itself.
- name: domains_generate_names
  description: 'Generate brand/business NAME IDEAS from a free-text description, when the user describes
    a business or idea but doesn''t have a name yet. Returns brandable names grouped by tone (neutral,
    playful, professional, friendly, informative, quirky).


    USE THIS (instead of domains_search) when the input is a description or sentence — e.g.:

    - "I have an idea for a custom fountain pen business"

    - "I''m thinking about starting a dog grooming side hustle"

    - "Help me come up with a name for my consulting firm"

    - "What should I call my photography business?"

    - "I''m building an app for tracking workouts"

    - "I''m looking for a domain for my photography studio"

    - "I need a domain for my bakery"


    The word "domain" in the request does NOT automatically mean domains_search. What matters is whether
    the user already has a name or keyword: if they only describe the TYPE of business ("my photography
    studio", "my bakery") without a brand name, use THIS tool first.


    These are NAME ideas, not domains. After generating, IMMEDIATELY call domains_search on the 3-4 most
    promising names across different tones — do NOT stop to ask the user which they prefer first. Then
    present the results grouped by tone: for each name, a short label and a small table of its available
    domains with prices, labeling each checkoutUrl "Click here to purchase on Squarespace". Finish with
    your top pick, then offer to refine by vibe, location, or a specific name they have in mind.


    For a keyword the user already has, call domains_search directly.'
  category: domains
  input_schema_published: true
  parameters:
  - name: body.description
    type: string
    required: true
    description: Free-text description of the business or idea; a full phrase or sentence is expected.
  routing_note: The description explicitly routes between the two tools — use this one when the input
    is a description or sentence, use domains_search when it is a keyword.
surface_gap:
  commerce_api_coverage: 0
  detail: The Commerce API (55 operations across Orders, Products, Inventory, Contacts, Discounts, Transactions,
    Analytics, Websites, Profiles and Webhook Subscriptions) has NO MCP representation. An agent that
    needs to read a merchant's orders or adjust inventory must call the REST API directly with a bearer
    token; there is no Squarespace-operated MCP path to it.
  crosswalk: mcp/squarespace-tool-crosswalk.yml

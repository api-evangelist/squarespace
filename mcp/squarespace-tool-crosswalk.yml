interpretation: >-
  Squarespace's agent investment sits in front of the funnel, not inside the product. The MCP server
  helps an agent name a business and buy it a domain — the moment a prospect becomes a Squarespace
  customer. Everything an agent could do FOR an existing merchant remains REST-only, bearer-token,
  and Advanced-plan-gated. Any tool-crosswalk consumer should read the zero here as a real,
  measured gap in agent reach over the commerce surface, not as a discovery failure.


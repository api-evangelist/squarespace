        createdOn:
          type: string
          description: ISO 8601 UTC date and time string; represents when the webhook subscription was created.
          format: date-time
          readOnly: true
          examples:
          - '2020-04-22T22:18:00Z'
        endpointUrl:
          type: string
          description: HTTPS URL to POST webhook notifications.
          examples:
          - https://example-extension.com/uninstall
        id:
          type: string
          description: Unique Webhook Subscription id.
          readOnly: true
          examples:
          - 7aff04bb-90e0-4002-96c2-69d8162c8dae
        secret:
          type: string
          description: 'Hexadecimal value used to generate a signature for a webhook notification;

            field is only returned when creating a new subscription or rotating a secret.

            Store the secret in a safe location to verify notifications from Squarespace.

            See the ''Verifying notifications'' guide under Webhooks for details.

            '
          readOnly: true
          examples:
          - F3F9B981C78E7A6187E42853F6CE2804177E98206164779423B02DEC981ACD6B
        topics:
          type: array
          description: List of event topics that trigger a webhook notification.
          items:
            type: string
            description: 'Description of the event that triggered the notification.

              * `order.create`        - always value for OrderCreatePayload.topic ref

              * `order.update`        - always value for OrderUpdatePayload.topic

              * `extension.uninstall` - always value for ExtensionUninstallPayload.topic

              * `contact.create`      - always value for ContactCreatePayload.topic

              * `contact.update`      - always value for ContactUpdatePayload.topic

              * `contact.delete`      - always value for ContactDeletePayload.topic

              * `address.create`      - always value for AddressCreatePayload.topic

              * `address.update`      - always value for AddressUpdatePayload.topic

              * `address.delete`      - always value for AddressDeletePayload.topic

              '
            enum:
            - order.create
            - order.update
            - extension.uninstall
            - contact.create
            - contact.update
            - contact.delete
            - address.create
            - address.update
            - address.delete
            examples:
            - extension.uninstall
        updatedOn:
          type: string
          description: ISO 8601 UTC date and time string; represents when the webhook subscription was last modified.
          format: date-time
          readOnly: true
          examples:
          - '2020-04-22T22:18:00Z'
        websiteId:
          type: string
          description: Unique Webhook Subscription id.
          readOnly: true
          examples:
          - 7aff04bb-90e0-4002-96c2-69d8162c8dae

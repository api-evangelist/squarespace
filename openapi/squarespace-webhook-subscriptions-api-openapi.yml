    ExternalCreateWebhookSubscriptionResponse:
      required:
      - clientId
      - createdOn
      - endpointUrl
      - id
      - secret
      - updatedOn
      - websiteId
      type: object
      properties:
        clientId:
          type: string
          description: Third-party client id.
          readOnly: true
          examples:

openapi: 3.2.0
info:
  title: Squarespace Commerce Inventory Webhook Subscriptions API
  description: The Squarespace Commerce API provides programmatic access to the commerce features of a Squarespace merchant site. It enables developers to build integrations and applications that manage products, process orders, track inventory, access customer profiles, retrieve financial transactions, and configure webhook subscriptions. All endpoints use HTTPS and follow REST principles with standard verbs and response status codes. Authentication is handled via API keys or OAuth tokens.
  version: '1.0'
  contact:
    name: Squarespace Developer Support
    url: https://developers.squarespace.com/commerce-apis/overview
  termsOfService: https://www.squarespace.com/terms-of-service
servers:
- url: https://api.squarespace.com/1.0
  description: Production Server
security:
- bearerAuth: []
tags:
- name: Webhook Subscriptions
  description: Manage webhook subscriptions for real-time event notifications
paths:
  /webhook_subscriptions:
    get:
      operationId: listWebhookSubscriptions
      summary: Retrieve All Webhook Subscriptions
      description: Returns all webhook subscriptions configured for the authenticated merchant site. Each subscription includes its endpoint URL, subscribed topics, and creation metadata. Squarespace supports up to 25 active webhook subscriptions per website.
      tags:
      - Webhook Subscriptions
      responses:
        '200':
          description: Successful response with list of webhook subscriptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhookSubscriptions:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createWebhookSubscription
      summary: Create a Webhook Subscription
      description: Creates a new webhook subscription for the authenticated merchant site. The subscription must specify a publicly accessible endpoint URL and at least one event topic to subscribe to. Upon creation, a secret is generated for verifying the authenticity of incoming webhook notifications via HMAC-SHA256 signature validation. Requires OAuth token authentication.
      tags:
      - Webhook Subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookSubscriptionRequest'
      responses:
        '200':
          description: Webhook subscription created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionWithSecret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /webhook_subscriptions/{subscriptionId}:
    get:
      operationId: getWebhookSubscription
      summary: Retrieve a Specific Webhook Subscription
      description: Retrieves details for a single webhook subscription by its unique identifier. Returns the subscription configuration including endpoint URL and subscribed topics. The subscription secret is not returned in this response.
      tags:
      - Webhook Subscriptions
      parameters:
      - $ref: '#/components/parameters/subscriptionId'
      responses:
        '200':
          description: Successful response with webhook subscription details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: updateWebhookSubscription
      summary: Update a Webhook Subscription
      description: Updates an existing webhook subscription. The endpoint URL and subscribed topics can be modified. Requires OAuth token authentication.
      tags:
      - Webhook Subscriptions
      parameters:
      - $ref: '#/components/parameters/subscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookSubscriptionRequest'
      responses:
        '200':
          description: Webhook subscription updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteWebhookSubscription
      summary: Delete a Webhook Subscription
      description: Permanently deletes a webhook subscription. After deletion, Squarespace will no longer send event notifications to the subscription's endpoint URL. Requires OAuth token authentication.
      tags:
      - Webhook Subscriptions
      parameters:
      - $ref: '#/components/parameters/subscriptionId'
      responses:
        '204':
          description: Webhook subscription deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /webhook_subscriptions/{subscriptionId}/actions/sendTestNotification:
    post:
      operationId: sendTestNotification
      summary: Send a Test Notification
      description: Sends a test notification to the webhook subscription's configured endpoint URL. This is useful for verifying that the endpoint is reachable and correctly processing Squarespace webhook payloads before relying on live events.
      tags:
      - Webhook Subscriptions
      parameters:
      - $ref: '#/components/parameters/subscriptionId'
      responses:
        '200':
          description: Test notification sent successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /webhook_subscriptions/{subscriptionId}/actions/rotateSecret:
    post:
      operationId: rotateWebhookSecret
      summary: Rotate a Webhook Subscription Secret
      description: Generates a new secret for the specified webhook subscription and invalidates the previous secret. The new secret must be stored securely and used to verify the Squarespace-Signature header on subsequent notifications. Rotating the secret is recommended periodically or when the secret may have been compromised.
      tags:
      - Webhook Subscriptions
      parameters:
      - $ref: '#/components/parameters/subscriptionId'
      responses:
        '200':
          description: Webhook secret rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionWithSecret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /1.0/webhook_subscriptions:
    get:
      description: Retrieves information for all webhook subscriptions. The response contains up to 25 Webhook Subscriptions. Requires an OAuth access token; API keys are not supported.
      operationId: getWebhookSubscriptions
      parameters:
      - in: header
        name: Authorization
        required: true
        description: API key or OAuth access token
        schema:
          type: string
          default: Bearer YOUR_API_KEY_OR_OAUTH_TOKEN
      - in: header
        name: User-Agent
        required: true
        description: User Agent
        schema:
          type: string
          default: YOUR_CUSTOM_APP_DESCRIPTION
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalWebhookSubscriptionListResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorPayload'
          description: Not found. The API version is not supported.
      summary: List webhook subscriptions
      tags:
      - Webhook Subscriptions
    post:
      callbacks:
        address.create:
          '{$request.body#/endpointUrl}':
            post:
              description: Address created details pushed to the registered callback URL
              operationId: createAddressEvent
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/AddressCreatePayload'
                description: address.create event details payload
                required: true
              responses:
                '200':
                  description: Notification received by the external service.
        address.delete:
          '{$request.body#/endpointUrl}':
            post:
              description: Address delete details pushed to the registered callback URL
              operationId: deleteAddressEvent
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/AddressDeletePayload'
                description: address.delete event details payload
                required: true
              responses:
                '200':
                  description: Notification received by the external service.
        address.update:
          '{$request.body#/endpointUrl}':
            post:
              description: Address update details pushed to the registered callback URL
              operationId: updateAddressEvent
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/AddressUpdatePayload'
                description: address.update event details payload
                required: true
              responses:
                '200':
                  description: Notification received by the external service.
        contact.create:
          '{$request.body#/endpointUrl}':
            post:
              description: Contact created details pushed to the registered callback URL
              operationId: createContactEvent
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ContactCreatePayload'
                description: contact.create event details payload
                required: true
              responses:
                '200':
                  description: Notification received by the external service.
        contact.delete:
          '{$request.body#/endpointUrl}':
            post:
              description: Contact delete details pushed to the registered callback URL
              operationId: deleteContactEvent
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ContactDeletePayload'
                description: contact.delete event details payload
                required: true
              responses:
                '200':
                  description: Notification received by the external service.
        contact.update:
          '{$request.body#/endpointUrl}':
            post:
              description: Contact update details pushed to the registered callback URL
              operationId: updateContactEvent
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ContactUpdatePayload'
                description: contact.update event details payload
                required: true
              responses:
                '200':
                  description: Notification received by the external service.
        extension.uninstall:
          '{$request.body#/endpointUrl}':
            post:
              description: Extension uninstalled details pushed to the registered callback URL
              operationId: uninstallExtensionEvent
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ExtensionUninstallPayload'
                description: extension.uninstall event details payload
                required: true
              responses:
                '200':
                  description: Notification received by the external service.
        order.create:
          '{$request.body#/endpointUrl}':
            post:
              description: Order created details pushed to the registered callback URL
              operationId: createOrderEvent
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/OrderCreatePayload'
                description: order.create event details payload
                required: true
              responses:
                '200':
                  description: Notification received by the external service.
        order.update:
          '{$request.body#/endpointUrl}':
            post:
              description: Order update details pushed to the registered callback URL
              operationId: updateOrderEvent
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/OrderUpdatePayload'
                description: order.update event details payload
                required: true
              responses:
                '200':
                  description: Notification received by the external service.
      description: 'Creates a webhook subscription. A successful request returns the created Webhook Subscription resource. Requires an OAuth access token; API keys are not supported. The OAuth token must hold scopes appropriate for each subscribed event topic: order.create and order.update require website.orders or website.orders.read; contact.create, contact.update, contact.delete, address.create, address.update, and address.delete require website.contacts; extension.uninstall requires no event-specific scope.'
      operationId: createWebhookSubscription
      parameters:
      - in: header
        name: Authorization
        required: true
        description: API key or OAuth access token
        schema:
          type: string
          default: Bearer YOUR_API_KEY_OR_OAUTH_TOKEN
      - in: header
        name: User-Agent
        required: true
        description: User Agent
        schema:
          type: string
          default: YOUR_CUSTOM_APP_DESCRIPTION
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalCreateWebhookSubscriptionRequest'
        description: Subscription details
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalCreateWebhookSubscriptionResponse'
          description: The created webhook subscription.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorPayload'
          description: Invalid input or malformed JSON
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorPayload'
          description: Not found. The API version is not supported.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorPayload'
          description: The Squarespace website has reached its limit of 25 webhook subscriptions.
      summary: Create webhook subscription
      tags:
      - Webhook Subscriptions
  /1.0/webhook_subscriptions/{subscriptionId}:
    delete:
      description: Deletes a webhook subscription. Requires an OAuth access token; API keys are not supported.
      operationId: deleteWebhookSubscription
      parameters:
      - description: Specifies the Webhook Subscription to delete.
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
      - in: header
        name: Authorization
        required: true
        description: API key or OAuth access token
        schema:
          type: string
          default: Bearer YOUR_API_KEY_OR_OAUTH_TOKEN
      - in: header
        name: User-Agent
        required: true
        description: User Agent
        schema:
          type: string
          default: YOUR_CUSTOM_APP_DESCRIPTION
      responses:
        '204':
          description: No content. The webhook subscription was deleted successfully.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorPayload'
          description: The requested Webhook Subscription was not found.
      summary: Delete webhook subscription
      tags:
      - Webhook Subscriptions
    get:
      description: Retrieves information for a specific webhook subscription. Requires an OAuth access token; API keys are not supported.
      operationId: getWebhookSubscription
      parameters:
      - description: Specifies the Webhook Subscription to retrieve.
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
      - in: header
        name: Authorization
        required: true
        description: API key or OAuth access token
        schema:
          type: string
          default: Bearer YOUR_API_KEY_OR_OAUTH_TOKEN
      - in: header
        name: User-Agent
        required: true
        description: User Agent
        schema:
          type: string
          default: YOUR_CUSTOM_APP_DESCRIPTION
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalWebhookSubscriptionResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorPayload'
          description: The requested Webhook Subscription was not found.
      summary: Get webhook subscription
      tags:
      - Webhook Subscriptions
    post:
      description: 'Updates information for a webhook subscription. A successful request returns the updated Webhook Subscription resource. Requires an OAuth access token; API keys are not supported. The OAuth token must hold scopes appropriate for each subscribed event topic: order.create and order.update require website.orders or website.orders.read; contact.create, contact.update, contact.delete, address.create, address.update, and address.delete require website.contacts; extension.uninstall requires no event-specific scope.'
      operationId: updateWebhookSubscription
      parameters:
      - description: Specifies the Webhook Subscription to update.
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
      - in: header
        name: Authorization
        required: true
        description: API key or OAuth access token
        schema:
          type: string
          default: Bearer YOUR_API_KEY_OR_OAUTH_TOKEN
      - in: header
        name: User-Agent
        required: true
        description: User Agent
        schema:
          type: string
          default: YOUR_CUSTOM_APP_DESCRIPTION
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalUpdateWebhookSubscriptionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalWebhookSubscriptionResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorPayload'
          description: The request body does not conform to the required specification.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorPayload'
          description: The requested Webhook Subscription was not found.
      summary: Update webhook subscription
      tags:
      - Webhook Subscriptions
  /1.0/webhook_subscriptions/{subscriptionId}/actions/rotateSecret:
    post:
      description: Rotates a webhook subscription's secret. The previous secret for a subscription is no longer valid after a new one is generated. Requires an OAuth access token; API keys are not supported.
      operationId: rotateSubscriptionSecret
      parameters:
      - description: Specifies the Webhook Subscription to update.
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
      - in: header
        name: Authorization
        required: true
        description: API key or OAuth access token
        schema:
          type: string
          default: Bearer YOUR_API_KEY_OR_OAUTH_TOKEN
      - in: header
        name: User-Agent
        required: true
        description: User Agent
        schema:
          type: string
          default: YOUR_CUSTOM_APP_DESCRIPTION
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalRotateSecretResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorPayload'
          description: The requested Webhook Subscription was not found.
      summary: Rotate webhook subscription secret
      tags:
      - Webhook Subscriptions
  /1.0/webhook_subscriptions/{subscriptionId}/actions/sendTestNotification:
    post:
      description: Sends a notification to a subscribed webhook endpoint for testing purposes. This is a one-time notification, and will not be retried if it fails or times out. Requires an OAuth access token; API keys are not supported.
      operationId: sendTestNotificationForWebhookSubscription
      parameters:
      - description: Specifies the Webhook Subscription to send a notification to.
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
      - in: header
        name: Authorization
        required: true
        description: API key or OAuth access token
        schema:
          type: string
          default: Bearer YOUR_API_KEY_OR_OAUTH_TOKEN
      - in: header
        name: User-Agent
        required: true
        description: User Agent
        schema:
          type: string
          default: YOUR_CUSTOM_APP_DESCRIPTION
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalSendTestNotificationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalTestNotificationResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorPayload'
          description: The request body does not conform to the required specification.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorPayload'
          description: The requested Webhook Subscription was not found.
      summary: Send test notification
      tags:
      - Webhook Subscriptions
components:
  schemas:
    WebhookSubscriptionWithSecret:
      allOf:
      - $ref: '#/components/schemas/WebhookSubscription'
      - type: object
        properties:
          secret:
            type: string
            description: The HMAC-SHA256 signing secret used to verify the Squarespace-Signature header on incoming notifications. Only returned on creation and secret rotation. Store this value securely as it cannot be retrieved again.
    Error:
      type: object
      description: Standard error response returned by the Squarespace API
      properties:
        type:
          type: string
          description: Machine-readable error type identifier
        subtype:
          type: string
          description: Optional more specific error subtype
        message:
          type: string
          description: Human-readable description of the error
        statusCode:
          type: integer
          description: HTTP status code associated with the error
    WebhookSubscription:
      type: object
      description: A webhook subscription configuration for receiving event notifications
      properties:
        id:
          type: string
          description: Unique identifier for the webhook subscription
        endpointUrl:
          type: string
          format: uri
          description: The URL to which Squarespace sends event notification payloads. Must be a publicly accessible HTTPS endpoint.
        topics:
          type: array
          description: List of event topics this subscription is configured to receive
          items:
            type: string
            enum:
            - order.create
            - order.update
            - extension.uninstall
        createdOn:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp when the subscription was created
        updatedOn:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp when the subscription was last updated
    CreateWebhookSubscriptionRequest:
      type: object
      description: Request body for creating a new webhook subscription
      required:
      - endpointUrl
      - topics
      properties:
        endpointUrl:
          type: string
          format: uri
          description: The publicly accessible HTTPS URL to receive event notification payloads
        topics:
          type: array
          description: List of event topics to subscribe to. Must include at least one topic.
          minItems: 1
          items:
            type: string
            enum:
            - order.create
            - order.update
            - extension.uninstall
    UpdateWebhookSubscriptionRequest:
      type: object
      description: Request body for updating an existing webhook subscription
      properties:
        endpointUrl:
          type: string
          format: uri
          description: Updated HTTPS URL to receive event notification payloads
        topics:
          type: array
          description: Updated list of event topics to subscribe to
          minItems: 1
          items:
            type: string
            enum:
            - order.create
            - order.update
            - extension.uninstall
    ExternalUpdateWebhookSubscriptionRequest:
      type: object
      properties:
        endpointUrl:
          $ref: '#/components/schemas/ChangeString'
        topics:
          $ref: '#/components/schemas/ChangeListString'
    AddressDeleteData:
      required:
      - addressBookEntryIds
      - contactId
      type: object
      properties:
        addressBookEntryIds:
          type: array
          description: The IDs of the deleted address book entries.
          items:
            type: string
            description: The IDs of the deleted address book entries.
        contactId:
          type: string
          description: The contact's ID.
          examples:
          - 64a7e3d2c8f1b95e30a14d2b
        deletedOn:
          type: string
          description: Deletion date and time in UTC (ISO 8601 format) of the address book entries.
          format: date-time
          examples:
          - '2024-01-28T10:44:00Z'
      description: Identifiers and metadata for the deleted address book entries.
    ExternalCreateWebhookSubscriptionRequest:
      required:
      - endpointUrl
      type: object
      properties:
        endpointUrl:
          type: string
          description: HTTPS URL to POST webhook notifications.
          examples:
          - https://example-extension.com/uninstall
        topics:
          type: array
          description: List of event topics that trigger a webhook notification.
          items:
            type: string
            description: 'Description of the event that triggered the notification.

              * `order.create`        - always value for OrderCreatePayload.topic ref

              * `order.update`        - always value for OrderUpdatePayload.topic

              * `extension.uninstall` - always value for ExtensionUninstallPayload.topic

              * `contact.create`      - always value for ContactCreatePayload.topic

              * `contact.update`      - always value for ContactUpdatePayload.topic

              * `contact.delete`      - always value for ContactDeletePayload.topic

              * `address.create`      - always value for AddressCreatePayload.topic

              * `address.update`      - always value for AddressUpdatePayload.topic

              * `address.delete`      - always value for AddressDeletePayload.topic

              '
            enum:
            - order.create
            - order.update
            - extension.uninstall
            - contact.create
            - contact.update
            - contact.delete
            - address.create
            - address.update
            - address.delete
            examples:
            - extension.uninstall
    ExtensionUninstallData:
      required:
      - clientId
      type: object
      properties:
        clientId:
          type: string
          description: Third-party client id.
          examples:
          - A125dfPqdKJDqPAcJQgLo3A5mwcKIq2G
      description: The extension uninstall details.
    OrderUpdatePayload:
      required:
      - createdOn
      - id
      - subscriptionsId
      - topic
      - websiteId
      type: object
      properties:
        createdOn:
          type: string
          description: Creation date and time in UTC (ISO 8601 format) of this message.
          format: date-time
          examples:
          - '2024-01-28T10:44:00Z'
        data:
          $ref: '#/components/schemas/OrderUpdateData'
        id:
          type: string
          description: Unique notification id.
          examples:
          - 5c2ba184b63ed3cb411ce2b1
        subscriptionsId:
          type: string
          description: Unique Webhook Subscriptions id.
          examples:
          - 5f3c2155d947844beedda991
        topic:
          type: string
          description: 'Description of the event that triggered the notification.

            * `order.create`        - always value for OrderCreatePayload.topic ref

            * `order.update`        - always value for OrderUpdatePayload.topic

            * `extension.uninstall` - always value for ExtensionUninstallPayload.topic


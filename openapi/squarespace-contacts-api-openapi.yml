      type: object
      properties:
        contacts:
          type: array
          description: paginated list of contacts retrieved
          items:
            $ref: '#/components/schemas/Contact'
        pagination:
          examples:
          - hasNextPage: true
            nextPageCursor: ewogICJhIiA6ICI2OWNhOWExZjgxNGMwYTY0MmIwMTIzYzkiLAogICJiIiA6ICJJRCIKfQ
            nextPageUrl: /v1/contacts?cursor=ewogICJhIiA6ICI2OWNhOWExZjgxNGMwYTY0MmIwMTIzYzkiLAogICJiIiA6ICJJRCIKfQ
          type: object
          properties:
            hasNextPage:
              type: boolean
            nextPageCursor:
              type: string
            nextPageUrl:
              type: string
    GetAddressBookResponse:
      type: object
      properties:
        addressBook:
          $ref: '#/components/schemas/AddressBook'
        pagination:
          $ref: '#/components/schemas/PaginationDetails'
    PaginationDetails:
      type: object
      properties:
        hasNextPage:
          type: boolean
        nextPageCursor:
          type: string
        nextPageUrl:
          type: string
    QueryContactsRequest:
      type: object
      properties:
        acceptsMarketingWithDate:
          $ref: '#/components/schemas/AcceptsMarketingWithDate'
        cursor:
          type: string
          description: The cursor for the next page of results. Use the value of `pagination.nextPageCursor` from the previous response.
        donationAmount:
          $ref: '#/components/schemas/IntegerFilter'
        donationCount:
          $ref: '#/components/schemas/IntegerFilter'
        firstDonationOn:
          $ref: '#/components/schemas/DateFilter'
        firstOrderOn:
          $ref: '#/components/schemas/DateFilter'
        lastDonationOn:
          $ref: '#/components/schemas/DateFilter'
        lastOrderOn:
          $ref: '#/components/schemas/DateFilter'
        orderAmount:
          $ref: '#/components/schemas/IntegerFilter'
        orderCount:
          $ref: '#/components/schemas/IntegerFilter'
        pageSize:
          maximum: 1000
          minimum: 1
          type: integer
          description: The number of contacts to return per request.
          format: int32
          default: 50
        searchString:
          type: string
          description: Search string for Name and Email address
        sortDirection:
          type: string
          description: Direction to sort results, ASCENDING or DESCENDING
          enum:
          - ASCENDING
          - DESCENDING
        sortField:
          type: string
          description: Field to sort results by
          enum:
          - ID
          - CREATED_ON
          - EMAIL
          - ACCEPTS_MARKETING_JOINED_ON
          - FIRST_NAME
          - LAST_NAME
          - ORDER_COUNT
          - LAST_ORDER_ON
          - ORDER_AMOUNT
          - DONATION_COUNT
          - LAST_DONATION_ON
          - DONATION_AMOUNT
      examples:
      - acceptsMarketingWithDate:
          acceptsMarketing: true
          joinedOn:
            before: '2025-11-21T10:00:00Z'
            after: '2020-11-26T14:30:00Z'
        searchString: jane
        firstOrderOn:
          before: '2025-11-21T10:00:00Z'
          after: '2025-11-26T14:30:00Z'
        lastOrderOn:
          before: '2025-11-21T10:00:00Z'
          after: '2025-11-26T14:30:00Z'
        orderCount:
          min: 1
          max: 10
        firstDonationOn:
          before: '2025-11-21T10:00:00Z'
          after: '2025-11-26T14:30:00Z'
        lastDonationOn:
          before: '2025-11-21T10:00:00Z'
          after: '2025-11-26T14:30:00Z'
        donationCount:
          min: 1
          max: 10
        pageSize: 50
        cursor: abc
        sortField: createdOn
        sortDirection: ASCENDING
    PaginatedGetContactsResponse:
      type: object
      properties:
        contacts:
          type: array
          description: paginated list of contacts retrieved
          items:
            $ref: '#/components/schemas/Contact'
        pagination:
          examples:
          - hasNextPage: true
            nextPageCursor: ewogICJhIiA6ICI2OWNhOWExZjgxNGMwYTY0MmIwMTIzYzkiLAogICJiIiA6ICJJRCIKfQ
            nextPageUrl: /v1/contacts?cursor=ewogICJhIiA6ICI2OWNhOWExZjgxNGMwYTY0MmIwMTIzYzkiLAogICJiIiA6ICJJRCIKfQ
          type: object
          properties:
            hasNextPage:
              type: boolean
            nextPageCursor:
              type: string
            nextPageUrl:
              type: string

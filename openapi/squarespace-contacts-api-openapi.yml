    CreateEmail:
      required:
      - email
      type: object
      properties:
        acceptsMarketing:
          type: boolean
          description: If contact's email accepts marketing
          default: false
        email:
          type: string
          format: email
          description: The email address.
          examples:
          - jane.doe@example.com
      description: Primary email supplied when creating a contact.
    UpdateAddressBookEntryRequest:
      required:
      - address
      type: object
      properties:
        address:
          $ref: '#/components/schemas/ContactAddress'
        defaultShipping:
          type: boolean
          description: Whether this entry should be the default shipping address. When updating the entry that is currently the default, changing this value from true to false has no effect.
    AcceptsMarketingWithDate:
      type: object
      properties:
        acceptsMarketing:
          type: boolean
          description: If contact's email accepts marketing
        joinedOn:
          $ref: '#/components/schemas/DateFilter'
      description: Contact's marketing settings with joined on date
    CreateAddressBookEntryRequest:
      required:
      - address
      type: object
      properties:
        address:
          $ref: '#/components/schemas/ContactAddress'
        defaultShipping:
          type: boolean
          description: Whether this entry should be the default shipping address. If this is the only address book entry for the contact after creation, it becomes the default even when set to false.
    AddressBook:
      type: object
      properties:
        addressBookEntries:
          type: array
          description: List of Address Book Entries
          items:
            $ref: '#/components/schemas/AddressBookEntry'
        defaultShippingAddressId:
          type: string
          description: The id of the address book entry that is the default shipping address.
      description: Address settings for a contact. When there is at least one address book entry, exactly one is the default shipping address; default shipping address is always returned on the first page of paginated results).
    DateFilter:
      type: object
      properties:
        after:
          type: string
          description: Filter out any dates after
          format: date-time
        before:
          type: string
          description: Filter out any dates before
          format: date-time
      description: Object for filtering by before and after dates
    CreateContactResponse:
      type: object
      properties:
        contact:
          $ref: '#/components/schemas/Contact'
    Email:
      type: object
      properties:
        acceptsMarketing:
          $ref: '#/components/schemas/AcceptsMarketing'
        createdOn:
          type: string
          description: The date and time when the email was created.
          format: date-time
          readOnly: true
        email:
          type: string
          format: email
          description: The email address.
          examples:
          - jane.doe@example.com
      description: The contact's primary email.
    AddressBookEntry:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/ContactAddress'
        defaultShipping:
          type: boolean
          description: Whether this entry is the current default shipping address. When the contact has any address book entries, exactly one entry has this value set to true.
        id:
          type: string
          description: The address book entry's ID.
          readOnly: true
          examples:
          - 5f8d0d55b54764421b7156aa
      description: An address book entry for a contact.
    IntegerFilter:
      type: object
      properties:
        max:
          type: integer
          description: Filter out any numbers greater
          format: int32
        min:
          type: integer
          description: Filter out any numbers lower
          format: int32
      description: Object for filtering by a min and max integer
    PatchContactResponse:
      type: object
      properties:
